                document.getElementById("sifre-ekrani").style.display = "none";
                document.getElementById("ana-sayfa-icerik").style.display = "block";
                sayacKur();

        function sayacKur() {
            const baslangic = new Date("2024-03-26");
            const bugun = new Date();
            const fark = Math.floor((bugun - baslangic) / (1000 * 60 * 60 * 24));
            
            let current = 0;
            const interval = setInterval(() => {
                if (current >= fark) {
                    document.getElementById("sayac").innerText = fark;
                    clearInterval(interval);
                } else {
                    current += Math.ceil(fark/50);
                    if(current > fark) current = fark;
                    document.getElementById("sayac").innerText = current;
                }
            }, 20);
